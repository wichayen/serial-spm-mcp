[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serial-spm-mcp"
version = "0.8.1"
description = "Serial device MCP server with persistent Serial Port Monitor capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex Gompper" },
]
keywords = ["mcp", "serial", "uart", "embedded", "iot", "serialx"]
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.13.5",
    "psutil==7.2.2",
    "serialx==1.15.1",
]

[project.urls]
Homepage = "https://github.com/wichayen/serial-spm-mcp"
Repository = "https://github.com/wichayen/serial-spm-mcp"
Issues = "https://github.com/wichayen/serial-spm-mcp/issues"

[project.scripts]
serial-spm-mcp = "serial_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["serial_mcp"]
